<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理者ダッシュボード | さくら歯科クリニック</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/a11y.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .filter-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      align-items: center;
    }
    .filter-bar input, .filter-bar select {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: white;
      font-size: 14px;
    }
    .filter-bar input { flex: 1; min-width: 200px; }
    .chip {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0EA5E9, #6366F1);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }
    .name-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .actions-cell {
      display: flex;
      gap: 6px;
    }
    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn:hover { background: var(--bg); }
    .icon-btn.danger:hover { background: #FEE2E2; color: var(--danger); border-color: #FCA5A5; }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 1.5s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <!-- ===== Sidebar ===== -->
    <aside class="admin-sidebar" data-page="reservations"></aside>

    <!-- ===== Main ===== -->
    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1>予約一覧</h1>
          <div class="text-sm muted mt-2">
            <span class="pulse-dot" style="margin-right: 6px"></span>
            ライブ更新中 · 最終取得 2026/05/25 09:42
          </div>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-ghost btn-sm"><i data-lucide="download" width="14"></i>CSV出力</button>
          <button class="btn btn-primary btn-sm"><i data-lucide="plus" width="14"></i>予約を追加</button>
        </div>
      </div>

      <!-- KPI -->
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-label">本日の予約</div>
          <div class="kpi-value" id="kpi-today">-</div>
          <div class="kpi-delta">前週同曜日 +2件</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">今週の予約</div>
          <div class="kpi-value" id="kpi-week">-</div>
          <div class="kpi-delta">予約率 78%</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">未確認</div>
          <div class="kpi-value" id="kpi-pending" style="color: var(--warning)">-</div>
          <div class="kpi-delta" style="color: var(--warning)">要対応</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">今月の売上見込</div>
          <div class="kpi-value" id="kpi-revenue">¥-</div>
          <div class="kpi-delta">前月比 +12%</div>
        </div>
      </div>

      <!-- フィルタ -->
      <div class="filter-bar">
        <div style="position:relative; flex:1; min-width: 200px;">
          <i data-lucide="search" width="16" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted)"></i>
          <input id="search" type="text" placeholder="お名前・電話番号で検索" style="padding-left: 36px; width: 100%;" oninput="renderTable()" />
        </div>
        <select id="filter-date" onchange="renderTable()">
          <option value="">すべての日付</option>
          <option value="2026-05-25" selected>2026/05/25(月)</option>
          <option value="2026-05-26">2026/05/26(火)</option>
          <option value="2026-05-27">2026/05/27(水)</option>
          <option value="2026-05-28">2026/05/28(木)</option>
          <option value="2026-05-29">2026/05/29(金)</option>
        </select>
      </div>

      <div class="flex gap-2 mb-4" id="status-chips">
        <div class="chip active" data-status="all" onclick="filterByStatus('all')">すべて</div>
        <div class="chip" data-status="confirmed" onclick="filterByStatus('confirmed')">確定</div>
        <div class="chip" data-status="pending" onclick="filterByStatus('pending')">未確認</div>
        <div class="chip" data-status="completed" onclick="filterByStatus('completed')">完了</div>
        <div class="chip" data-status="cancelled" onclick="filterByStatus('cancelled')">キャンセル</div>
      </div>

      <!-- テーブル -->
      <div id="table-wrap"></div>
    </main>
  </div>

  <!-- モーダル -->
  <div id="modal-area"></div>
  <div id="toast-area"></div>

  <script src="assets/data.js"></script>
  <script src="assets/sidebar.js"></script>
  <script src="assets/admin.js"></script>
</body>
</html>
