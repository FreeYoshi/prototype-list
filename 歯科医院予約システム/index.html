<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チェアログ - AOBA DENTAL CLINIC</title>
<style>
:root{
  --chrome:#33283C;
  --chrome-2:#4A3B54;
  --ink:#221B27;
  --bg:#EBE7EA;
  --paper:#FBF9FA;
  --grid:rgba(34,27,39,.09);
  --mint:#5FB3A1;
  --mint-d:#3E8677;
  --coral:#E1907A;
  --coral-d:#C56B52;
  --ochre:#C9A96E;
  --ochre-d:#A5854A;
  --lav:#9C8BC4;
  --lav-d:#7362A0;
  --open:#D8455E;
  --open-lt:#F0798D;
  --muted:#75697C;
  --ui:"Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Hiragino Sans","Yu Gothic",monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--ui);color:var(--ink);
  background:radial-gradient(120% 90% at 50% 0%,#3A2F44 0%,#241D2B 45%,#151119 100%);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:4px}

/* ---------- 端末フレーム ---------- */
#stage{width:414px;height:868px;transform-origin:center center}
.phone{
  width:414px;height:868px;padding:12px;border-radius:56px;background:#0A080C;
  box-shadow:0 0 0 2px #4B4152,0 40px 90px rgba(0,0,0,.62),0 8px 24px rgba(0,0,0,.5),
             inset 0 1px 1px rgba(255,255,255,.14);
  position:relative;
}
.phone::after{content:"";position:absolute;left:-2px;top:150px;width:2px;height:66px;background:#5B5065;border-radius:2px}
.screen{
  width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg);
  position:relative;display:flex;flex-direction:column;
}

/* ---------- ステータスバー ---------- */
.statusbar{
  height:52px;flex:0 0 52px;background:var(--chrome);color:#fff;position:relative;
  display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;
}
.island{
  position:absolute;left:50%;top:9px;transform:translateX(-50%);
  width:118px;height:32px;border-radius:18px;background:#000;
}
.sb-time{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.2px}
.sb-right{display:flex;align-items:center;gap:5px}
.sb-5g{font-size:10.5px;font-weight:700;letter-spacing:.3px}

/* ---------- ヘッダー ---------- */
.appbar{background:var(--chrome);color:#fff;padding:4px 14px 12px;border-bottom:3px solid var(--mint)}
.appbar-row{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--mint);display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:15.5px;font-weight:800;letter-spacing:.4px;line-height:1.15}
.brand span{display:block;font-size:8.5px;letter-spacing:1.3px;color:rgba(255,255,255,.5);font-family:var(--mono);margin-top:1px}
.who{
  width:34px;height:34px;border-radius:50%;background:var(--chrome-2);
  border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:700;flex:0 0 34px;
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}
.stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.09);border-radius:11px;padding:7px 8px 8px}
.stat i{display:block;font-style:normal;font-size:9px;color:rgba(255,255,255,.62);letter-spacing:.4px}
.stat b{display:block;font-size:17px;font-weight:800;margin-top:2px;line-height:1}
.stat b em{font-style:normal;font-size:10px;font-weight:700;margin-left:2px;opacity:.75}
.stat.alert{background:rgba(216,69,94,.22);border-color:var(--open-lt)}
.stat.alert i{color:#FFC4CE}
.stat.alert b{color:#FFD3DA}

/* ---------- 日付バー ---------- */
.datebar{
  flex:0 0 40px;height:40px;background:var(--paper);border-bottom:1px solid var(--grid);
  display:flex;align-items:center;justify-content:space-between;padding:0 8px;
}
.navbtn{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.navbtn:hover{background:rgba(34,27,39,.06)}
.datelabel{display:flex;align-items:baseline;gap:7px}
.datelabel b{font-size:14px;font-weight:800}
.datelabel span{font-size:9.5px;color:#fff;background:var(--mint-d);border-radius:20px;padding:2px 7px;font-weight:700}

/* ---------- チェア列ヘッダー ---------- */
.chairhead{flex:0 0 34px;height:34px;background:var(--paper);border-bottom:1px solid rgba(34,27,39,.14);display:flex;padding-right:6px}
.chairhead .gutter{flex:0 0 42px}
.chairhead div.ch{flex:1 1 0;text-align:center;border-left:1px solid var(--grid);display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.chairhead div.ch b{font-size:10.5px;font-weight:800}
.chairhead div.ch span{font-size:8.5px;color:var(--muted)}

/* ---------- 予約板 ---------- */
main{flex:1 1 auto;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.boardwrap{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;background:var(--paper);-webkit-overflow-scrolling:touch}
.boardwrap,.scroll,.sheet{scrollbar-width:none;-ms-overflow-style:none}
.boardwrap::-webkit-scrollbar,.scroll::-webkit-scrollbar,.sheet::-webkit-scrollbar{width:0;height:0;display:none}
.board{position:relative;width:390px;padding-bottom:26px}
.gline{position:absolute;left:42px;right:0;height:0;border-top:1px solid var(--grid)}
.gline.hour{border-top-color:rgba(34,27,39,.2)}
.tlabel{position:absolute;left:0;width:42px;text-align:right;padding-right:6px;font-family:var(--mono);font-size:9px;color:var(--muted);transform:translateY(-50%)}
.gutterline{position:absolute;left:42px;top:0;bottom:0;width:1px;background:rgba(34,27,39,.14)}
.collines{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.lunch{
  position:absolute;left:42px;right:0;
  background:repeating-linear-gradient(45deg,rgba(34,27,39,.055) 0 6px,rgba(34,27,39,0) 6px 12px);
  border-top:1px dashed rgba(34,27,39,.22);border-bottom:1px dashed rgba(34,27,39,.22);
  display:flex;align-items:center;justify-content:center;
}
.lunch span{font-size:9.5px;color:var(--muted);letter-spacing:2px;background:rgba(251,249,250,.82);padding:1px 8px;border-radius:20px}

.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--open);z-index:6;pointer-events:none}
.nowline::after{content:"";position:absolute;left:40px;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--open)}
.nowlabel{
  position:absolute;left:0;width:42px;z-index:7;pointer-events:none;transform:translateY(-50%);
  font-family:var(--mono);font-size:8.5px;font-weight:700;color:#fff;background:var(--open);
  border-radius:0 8px 8px 0;padding:2px 3px 2px 5px;text-align:left;
}

.apt{
  position:absolute;border-radius:7px;overflow:hidden;text-align:left;
  padding:3px 5px 3px 7px;display:flex;flex-direction:column;gap:0;
  background:var(--c);border-left:4px solid var(--cd);color:var(--ink);
  box-shadow:0 1px 2px rgba(34,27,39,.14);z-index:3;
}
button.apt:active{transform:scale(.985)}
.apt .a-t{font-family:var(--mono);font-size:8.5px;color:rgba(34,27,39,.62);line-height:1.25}
.apt .a-n{font-size:11.5px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apt .a-p{font-size:9px;color:rgba(34,27,39,.72);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apt .a-tag{
  align-self:flex-start;margin-top:2px;font-size:8px;font-weight:700;letter-spacing:.2px;
  background:var(--mint-d);color:#fff;border-radius:20px;padding:1px 6px;
}
.t-kensin{--c:#DCEFE9;--cd:var(--mint-d)}
.t-chiryo{--c:#F7DDD5;--cd:var(--coral-d)}
.t-hotetsu{--c:#F2E7CF;--cd:var(--ochre-d)}
.t-kyosei{--c:#E4DEF2;--cd:var(--lav-d)}
.t-kyukan{
  --c:#E4E0E6;--cd:#8C8194;
  background-image:repeating-linear-gradient(45deg,rgba(34,27,39,.09) 0 5px,rgba(34,27,39,0) 5px 10px);
}
.t-open{--c:#FBDCE2;--cd:var(--open);border-color:var(--open);z-index:5}
.t-open .a-n{color:var(--open)}
.t-open .a-p{color:var(--open);font-weight:700}
.blink{animation:blink 1.1s ease-in-out infinite}
@keyframes blink{0%,100%{background-color:#FBDCE2;box-shadow:0 0 0 0 rgba(216,69,94,0)}50%{background-color:#F6BCC7;box-shadow:0 0 0 5px rgba(216,69,94,.16)}}
.shrink{animation:shrink .34s cubic-bezier(.4,0,.2,1) both}
@keyframes shrink{0%{transform:scale(1)}45%{transform:scale(.9)}100%{transform:scale(1)}}
.fillin{animation:fillin .55s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes fillin{0%{transform:scale(.84);opacity:.2}55%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
.flash{position:absolute;inset:0;background:var(--mint);animation:flashout .55s ease-out both;pointer-events:none}
@keyframes flashout{0%{opacity:1}100%{opacity:0}}

/* ---------- 凡例 ---------- */
.legend{
  flex:0 0 auto;background:var(--paper);border-top:1px solid rgba(34,27,39,.12);
  padding:7px 10px;display:flex;flex-wrap:wrap;gap:5px 10px;
}
.lg{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--muted)}
.lg i{width:11px;height:11px;border-radius:3px;display:block;background:var(--c);border-left:3px solid var(--cd)}
.lg i.t-kyukan{background-image:repeating-linear-gradient(45deg,rgba(34,27,39,.16) 0 3px,rgba(34,27,39,0) 3px 6px)}

/* ---------- FAB ---------- */
.fab{
  position:absolute;right:14px;bottom:14px;z-index:20;
  width:62px;height:62px;border-radius:50%;background:var(--open);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:0 8px 20px rgba(216,69,94,.44),0 2px 5px rgba(0,0,0,.2);
}
.fab span{font-size:8.5px;font-weight:800;letter-spacing:.2px}
.fab:active{transform:scale(.94)}

/* ---------- タブバー ---------- */
.tabbar{
  flex:0 0 66px;height:66px;background:var(--chrome);display:flex;
  padding-bottom:9px;border-top:1px solid rgba(255,255,255,.08);
}
.tab{
  flex:1 1 0;position:relative;color:rgba(255,255,255,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding-top:4px;
}
.tab b{font-size:10px;font-weight:700}
.tab.on{color:#fff}
.tab.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--mint)}
.badge{
  position:absolute;top:6px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:9px;
  background:var(--open);color:#fff;font-size:9.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}

/* ---------- 汎用リスト画面 ---------- */
.scroll{flex:1 1 auto;overflow-y:auto;padding:12px 12px 26px}
.sect-h{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.3px;margin:0 0 8px 2px}
.card{background:var(--paper);border:1px solid rgba(34,27,39,.09);border-radius:13px;box-shadow:0 1px 2px rgba(34,27,39,.05)}

.wrow{display:flex;gap:9px;padding:10px 11px;margin-bottom:8px;border-left:4px solid var(--mint)}
.wrow.done{border-left-color:var(--open)}
.wrank{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--muted);flex:0 0 20px;line-height:1.2;padding-top:1px}
.wrow.done .wrank{color:var(--open)}
.wbody{flex:1 1 auto;min-width:0}
.wname{font-size:13px;font-weight:800}
.wname em{font-style:normal;font-size:10px;font-weight:600;color:var(--muted);margin-left:4px}
.wreply{font-size:9.5px;color:var(--muted);margin-top:2px}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pill{font-size:9px;background:rgba(95,179,161,.15);color:var(--mint-d);border-radius:20px;padding:2px 7px;font-weight:700}
.wnote{
  margin-top:8px;padding:7px 9px;border-radius:9px;background:rgba(216,69,94,.09);
  color:var(--open);font-size:10px;line-height:1.55;font-weight:700;
}
.kpi{padding:13px 14px;margin-top:4px}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.3px}
.kpi b em{font-style:normal;font-size:12px;margin-left:3px}
.kpi i{font-style:normal;display:block;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.3px}
.kpi p{font-size:10.5px;color:var(--muted);line-height:1.6;margin-top:7px}

.hero{padding:14px;margin-bottom:10px}
.hero i{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:700}
.hero b{display:block;font-size:30px;font-weight:800;line-height:1.1;margin-top:3px}
.hero b em{font-style:normal;font-size:14px;margin-left:3px}
.hero p{font-size:10px;color:var(--muted);line-height:1.55;margin-top:5px}
.bigbtn{
  width:100%;margin-top:11px;background:var(--mint-d);color:#fff;border-radius:11px;
  padding:12px;font-size:13px;font-weight:800;letter-spacing:.3px;
}
.bigbtn:disabled{background:rgba(34,27,39,.13);color:var(--muted);cursor:default}
.rrow{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;margin-bottom:8px}
.rbody{flex:1 1 auto;min-width:0}
.rname{font-size:12.5px;font-weight:800}
.rmeta{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:2px}
.rmemo{font-size:10px;color:var(--muted);line-height:1.55;margin-top:5px}
.tagpill{font-size:9.5px;font-weight:800;border-radius:20px;padding:3px 9px;flex:0 0 auto;margin-top:2px}
.tagpill.no{background:rgba(216,69,94,.13);color:var(--open)}
.tagpill.yes{background:rgba(95,179,161,.18);color:var(--mint-d)}
.foot{font-size:10.5px;color:var(--muted);line-height:1.65;padding:12px 13px}
.foot b{color:var(--ink)}

/* ---------- ボトムシート ---------- */
.scrim{position:absolute;inset:0;background:rgba(20,15,24,.5);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--paper);
  border-radius:22px 22px 0 0;padding:8px 16px 22px;max-height:78%;overflow-y:auto;
  transform:translateY(102%);transition:transform .36s cubic-bezier(.22,.9,.28,1);
  box-shadow:0 -10px 30px rgba(20,15,24,.28);
}
.sheet.on{transform:translateY(0)}
.grip{width:38px;height:4px;border-radius:4px;background:rgba(34,27,39,.16);margin:0 auto 12px}
.sh-sup{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.3px}
.sh-name{font-size:21px;font-weight:800;margin-top:2px;letter-spacing:-.2px}
.sh-name em{font-style:normal;font-size:13px;font-weight:700;color:var(--muted);margin-left:3px}
.sh-chip{display:inline-block;font-size:9.5px;font-weight:800;border-radius:20px;padding:3px 9px;margin-top:8px;background:var(--c,#eee);color:var(--cd,#333)}
.tbl{width:100%;border-collapse:collapse;margin-top:12px}
.tbl th,.tbl td{text-align:left;padding:7px 0;border-bottom:1px solid var(--grid);vertical-align:top}
.tbl th{font-size:10.5px;color:var(--muted);font-weight:700;width:66px}
.tbl td{font-size:12px;font-weight:700}
.tbl td span{font-family:var(--mono);font-weight:600}
.memo{margin-top:14px;background:rgba(34,27,39,.045);border-radius:11px;padding:10px 12px}
.memo i{font-style:normal;display:block;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.4px}
.memo p{font-size:11.5px;line-height:1.7;margin-top:5px}
.story{margin-top:12px;border-left:4px solid var(--mint);background:rgba(95,179,161,.1);border-radius:0 11px 11px 0;padding:10px 12px}
.story i{font-style:normal;display:block;font-size:10px;font-weight:800;color:var(--mint-d);letter-spacing:.4px}
.story p{font-size:11.5px;line-height:1.75;margin-top:5px}
.sh-btns{display:flex;gap:9px;margin-top:16px}
.sh-btns button{flex:1 1 0;border-radius:11px;padding:12px;font-size:13px;font-weight:800}
.b-main{background:var(--chrome);color:#fff}
.b-ghost{background:rgba(34,27,39,.07);color:var(--ink)}

/* ---------- 自動補填オーバーレイ ---------- */
.stageover{
  position:absolute;inset:0;z-index:60;background:linear-gradient(180deg,#2A2132 0%,#191320 100%);
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;
  opacity:0;pointer-events:none;transition:opacity .34s ease;
}
.stageover.on{opacity:1;pointer-events:auto}
.pulse{position:relative;width:112px;height:112px;display:flex;align-items:center;justify-content:center;flex:0 0 112px}
.core{width:66px;height:66px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;box-shadow:0 0 34px rgba(95,179,161,.5);z-index:2}
.ring{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;border:2px solid rgba(95,179,161,.6);animation:ripple 2.2s cubic-bezier(.2,.7,.3,1) infinite}
.stageover:not(.on) .ring{animation:none}
.ring:nth-child(2){animation-delay:.73s}
.ring:nth-child(3){animation-delay:1.46s}
@keyframes ripple{0%{transform:scale(.75);opacity:.85}100%{transform:scale(2.7);opacity:0}}
.ov-slot{font-family:var(--mono);font-size:23px;font-weight:700;letter-spacing:.6px;margin-top:14px}
.ov-chair{font-size:11px;color:rgba(255,255,255,.55);margin-top:3px;letter-spacing:1px}
.ov-msg{font-size:14.5px;font-weight:800;margin-top:16px;text-align:center;letter-spacing:.3px;min-height:22px}
.ov-list{width:100%;max-width:290px;margin-top:14px;min-height:180px}
.ov-row{
  display:flex;align-items:center;gap:9px;padding:8px 11px;margin-bottom:6px;border-radius:10px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.07);
  opacity:0;transform:translateY(10px);
}
.ov-row.in{animation:rowin .38s ease-out both}
@keyframes rowin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.ov-rank{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.45);flex:0 0 14px}
.ov-nm{flex:1 1 auto;font-size:12.5px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-nm em{font-style:normal;font-size:10px;color:rgba(255,255,255,.45);margin-left:4px;font-weight:600}
.ov-st{font-size:9.5px;font-weight:800;border-radius:20px;padding:3px 9px;background:rgba(255,255,255,.13);color:rgba(255,255,255,.7);flex:0 0 auto}
.ov-st.ok{background:var(--mint);color:#12211E}

/* ---------- トースト ---------- */
.toast{
  position:absolute;left:14px;right:14px;bottom:82px;z-index:70;
  background:var(--chrome);color:#fff;border-radius:12px;padding:11px 13px;
  font-size:11.5px;font-weight:700;line-height:1.5;letter-spacing:.2px;
  box-shadow:0 10px 26px rgba(0,0,0,.35);border-left:4px solid var(--mint);
  opacity:0;transform:translateY(12px);transition:opacity .26s ease,transform .26s ease;pointer-events:none;
}
.toast.on{opacity:1;transform:translateY(0)}
.toast.warn{border-left-color:var(--open)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.001s!important}
}
</style>

<div id="stage">
<div class="phone"><div class="screen">

  <div class="statusbar">
    <div class="island"></div>
    <div class="sb-time">14:20</div>
    <div class="sb-right">
      <span class="sb-5g">5G</span>
      <svg width="17" height="11" viewBox="0 0 17 11" aria-hidden="true">

/* ====== 端末フレームの自動縮小 ====== */
var stage = document.getElementById("stage");
function fit(){
  var s = Math.min(1, (window.innerWidth - 32) / 414, (window.innerHeight - 32) / 868);
  stage.style.transform = "scale(" + s.toFixed(4) + ")";
}
window.addEventListener("resize", fit);
fit();

/* ====== トースト ====== */
var toastEl = document.getElementById("toast");
var toastTimer = null;
function toast(msg, warn){
  toastEl.textContent = msg;
  toastEl.className = "toast on" + (warn ? " warn" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.className = "toast" + (warn ? " warn" : ""); }, 2800);
}

/* ====== 集計カード ====== */
function refreshStats(){
  var booked = APTS.filter(function(a){ return a.state !== "open"; });
  var openN  = APTS.filter(function(a){ return a.state === "open"; }).length;
  var used   = booked.reduce(function(t, a){ return t + (a.e - a.s); }, 0);
  var cap    = 3 * ((DAY_E - DAY_S) - (LUNCH_E - LUNCH_S));
  var rate   = Math.round(used / cap * 100);

  document.querySelector("#stat-apt b").innerHTML = booked.length + "<em>件</em>";
  document.querySelector("#stat-open b").innerHTML = openN + "<em>枠</em>";
  document.querySelector("#stat-rate b").innerHTML = rate + "<em>%</em>";
  document.getElementById("stat-open").className = "stat" + (openN > 0 ? " alert" : "");
}

/* ====== 予約板の描画 ====== */
var board = document.getElementById("board");
function renderBoard(){
  var html = "";
  var total = h(DAY_S, DAY_E);
  board.style.height = total + "px";

  // 方眼：30分ごとに薄い罫線、1時間ごとに濃い罫線
  for (var m = DAY_S; m <= DAY_E; m += 30){
    var isHour = (m % 60 === 0);
    html += '<div class="gline' + (isHour ? " hour" : "") + '" style="top:' + y(m) + 'px"></div>';
    if (isHour){
      html += '<div class="tlabel" style="top:' + y(m) + 'px">' + fmt(m) + "</div>";
    }
  }
  html += '<div class="gutterline"></div>';
  for (var i = 1; i < 3; i++){
    html += '<div class="collines" style="left:' + (GUTTER + i * COL_W) + 'px"></div>';
  }

  // 休診時間
  html += '<div class="lunch" style="top:' + y(LUNCH_S) + "px;height:" + h(LUNCH_S, LUNCH_E) + 'px">'
       +  "<span>休診</span></div>";

  // 予約ブロック
  APTS.forEach(function(a){
    var t = TYPES[a.ty];
    var top = y(a.s), hh = h(a.s, a.e);
    var left = GUTTER + a.ch * COL_W + 2;
    var w = COL_W - 5;
    var cls = a.state === "open" ? "t-open" : t.cls;
    var anim = a.anim ? (" " + a.anim) : "";

    var inner = "";
    if (a.state === "open"){
      inner  = '<span class="a-t">' + fmt(a.s) + " - " + fmt(a.e) + "</span>"
             + '<span class="a-n">空き枠</span>';
      if (hh > 42) inner += '<span class="a-p">キャンセル待ちへ通知中</span>';
    } else {
      inner  = '<span class="a-t">' + fmt(a.s) + "</span>"
             + '<span class="a-n">' + esc(a.nm) + "</span>";
      if (hh > 42) inner += '<span class="a-p">' + esc(t.label) + "</span>";
      if (a.auto && hh > 42) inner += '<span class="a-tag">自動補填</span>';
    }
    if (a.flash) inner += '<span class="flash"></span>';

    var tagName = (a.ty === "kyukan") ? "div" : "button";
    var attrs = 'class="apt ' + cls + (a.state === "open" && !a.anim ? " blink" : "") + anim + '" '
              + 'style="top:' + top + "px;height:" + hh + "px;left:" + left + "px;width:" + w + 'px" '
              + 'data-id="' + a.id + '"';
    if (tagName === "button") attrs += ' type="button"';
    html += "<" + tagName + " " + attrs + ">" + inner + "</" + tagName + ">";
  });

  // 現在時刻線
  html += '<div class="nowline" style="top:' + y(NOW_MIN) + 'px"></div>';
  html += '<div class="nowlabel" style="top:' + y(NOW_MIN) + 'px">' + fmt(NOW_MIN) + "</div>";

  board.innerHTML = html;
  APTS.forEach(function(a){ a.anim = null; a.flash = false; });
  refreshStats();
}

  if (!a) return;

});

    + "<tr><th>年齢</th><td>" + (a.ag ? a.ag + " 歳" : "&mdash;") + "</td></tr>"
    + "</tbody></table>"
    + '<div class="memo"><i>前回までの記録</i><p>' + esc(a.memo) + "</p></div>"
    + story
    + '<div class="sh-btns">'
    + '<button type="button" class="b-main" id="sh-karte">カルテを開く</button>'
    + '<button type="button" class="b-ghost" id="sh-close">閉じる</button>'
    + "</div>";

  document.getElementById("sh-close").addEventListener("click", closeSheet);
  document.getElementById("sh-karte").addEventListener("click", function(){
    closeSheet();
    toast(a.nm + " 様のカルテを開きます");
  });
  scrim.classList.add("on");
  sheet.classList.add("on");
}
function closeSheet(){ sheet.classList.remove("on"); scrim.classList.remove("on"); }
scrim.addEventListener("click", closeSheet);

/* ====== 空き待ちタブ ====== */
function renderWait(){
  var html = '<p class="sect-h">キャンセル待ち ' + WAIT.length + "名 &middot; 優先順</p>";
  WAIT.forEach(function(w, i){
    var done = (state.filled && i === 0);
    html += '<div class="card wrow' + (done ? " done" : "") + '">'
      + '<div class="wrank">' + (i + 1) + "</div>"
      + '<div class="wbody">'
      + '<div class="wname">' + esc(w.nm) + "<em>" + w.ag + " 歳</em></div>"
      + '<div class="wreply">' + esc(w.reply) + "</div>"
      + '<div class="pills">' + w.tags.map(function(t){ return '<span class="pill">' + esc(t) + "</span>"; }).join("") + "</div>"
      + (done ? '<div class="wnote">15:00 の枠をご案内し、2分で確定しました。予約表に反映済みです。</div>' : "")
      + "</div></div>";
  });
  html += '<div class="card kpi"><i>今月の補填実績</i><b>21<em>枠</em></b>'
        + "<p>キャンセルで空いた 24枠 のうち 21枠 が埋まりました。金額にして およそ 428,000円 分です。</p></div>";
  document.getElementById("waitscroll").innerHTML = html;
  document.getElementById("waitbadge").textContent = state.filled ? "4" : "5";
}

/* ====== リコールタブ ====== */
function renderRecall(){
  var target = RECALL.filter(function(r){ return !r.sent; }).length;
  var html = '<div class="card hero"><i>ご案内の対象</i><b>' + target + "<em>名</em></b>"
    + "<p>最終来院から 4か月以上が経過し、次の予約が入っていない方です。</p>"
    + '<button type="button" class="bigbtn" id="sendrecall"' + (target === 0 ? " disabled" : "") + ">"
    + (target === 0 ? "本日のご案内は送信済みです" : "まとめてご案内を送る") + "</button></div>";

  html += '<p class="sect-h">対象の方</p>';
  RECALL.forEach(function(r){
    html += '<div class="card rrow">'
      + '<div class="rbody"><div class="rname">' + esc(r.nm) + " 様</div>"
      + '<div class="rmeta">' + esc(r.last) + "</div>"
      + '<div class="rmemo">' + esc(r.memo) + "</div></div>"
      + '<span class="tagpill ' + (r.sent ? "yes" : "no") + '">' + (r.sent ? "送信済" : "未送信") + "</span>"
      + "</div>";
  });
  html += '<div class="card foot">リコール率の推移 &middot; 導入前 <b>41%</b> から <b>72%</b> に改善しています。'
        + "案内は最終来院からの経過と前回の処置内容に合わせて、文面を変えて送っています。</div>";

  document.getElementById("recallscroll").innerHTML = html;
  var btn = document.getElementById("sendrecall");
  if (btn && !btn.disabled){
    btn.addEventListener("click", function(){
      var n = RECALL.filter(function(r){ return !r.sent; }).length;
      RECALL.forEach(function(r){ r.sent = true; });
      state.recallSent = true;
      renderRecall();
      toast(n + "名にご案内をお送りしました");
    });
  }
}

/* ====== タブ切り替え ====== */
var views = { board:"view-board", wait:"view-wait", recall:"view-recall" };
document.getElementById("tabbar").addEventListener("click", function(e){
  var b = e.target.closest(".tab");
  if (!b) return;
  var k = b.getAttribute("data-tab");
  state.tab = k;
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
    t.classList.toggle("on", t === b);
  });
  Object.keys(views).forEach(function(v){
    document.getElementById(views[v]).classList.toggle("on", v === k);
  });
  if (k === "wait") renderWait();
  if (k === "recall") renderRecall();
});

document.getElementById("prevday").addEventListener("click", function(){ toast("前の日の予約表は、この画面では切り替えできません"); });
document.getElementById("nextday").addEventListener("click", function(){ toast("次の日の予約表は、この画面では切り替えできません"); });

/* ====== キャンセル発生 → 自動補填 ====== */
var over   = document.getElementById("over");
var ovmsg  = document.getElementById("ovmsg");
var ovlist = document.getElementById("ovlist");
var running = false;

function target(){ return APTS.filter(function(x){ return x.id === CANCEL_ID; })[0]; }

// 撮り直しのため、キャンセル対象の初期値を控えておく
var BASE = (function(){
  var a = target();
  return { nm:a.nm, ag:a.ag, ty:a.ty, memo:a.memo };
})();
var BASE_RECALL = RECALL.map(function(r){ return r.sent; });

// 進行中の演出を止められるようにタイマーをまとめて持つ
var timers = [];
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
function stopTimers(){ timers.forEach(clearTimeout); timers = []; }

function resetDemo(){
  stopTimers();
  running = false;
  closeSheet();
  over.classList.remove("on");
  ovlist.innerHTML = "";
  ovmsg.textContent = "条件の合う方を探しています";

  var a = target();
  a.nm = BASE.nm; a.ag = BASE.ag; a.ty = BASE.ty; a.memo = BASE.memo;
  a.state = "booked"; a.auto = false; a.anim = null; a.flash = false;

  state.cancelled = false;
  state.filled = false;
  state.cancelDone = false;

  renderBoard();
  renderWait();
  scrollToNow();
}

document.getElementById("fab").addEventListener("click", function(){
  if (running) return;
  // 2回目以降は初期状態に戻してから、同じ流れをもう一度再生する
  if (state.cancelDone) resetDemo();
  runCancelFlow();
});

// 撮影用の隠しショートカット（画面には出さない）
// R：予約表とリコールを初期状態に戻す ／ C：キャンセルから自動補填までを再生
document.addEventListener("keydown", function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key.toLowerCase();
  if (k === "r"){
    resetDemo();
    RECALL.forEach(function(r, i){ r.sent = BASE_RECALL[i]; });
    state.recallSent = false;
    renderRecall();
    toast("デモを初期状態に戻しました");
  } else if (k === "c"){
    if (running) return;
    if (state.cancelDone) resetDemo();
    runCancelFlow();
  }
});

function runCancelFlow(){
  running = true;
  state.cancelDone = true;
  closeSheet();

  var a = target();

  // 1) 空き枠に変わる（一度わずかに縮んでから朱色へ）
  a.state = "open";
  a.anim = "shrink";
  renderBoard();
  scrollToNow();
  toast("中村 由紀 様のキャンセルを登録しました", true);

  // 縮み終わったら明滅（1.1秒周期）に入る
  later(function(){ renderBoard(); }, 360);

  // 2) 1.2秒後：探索中のオーバーレイ
  later(function(){
    ovmsg.textContent = "条件の合う方を探しています";
    ovlist.innerHTML = "";
    over.classList.add("on");
  }, 1200);

  // 3) 2.6秒後：5名へ送信、名前が0.16秒ずつ遅れて出る
  later(function(){
    ovmsg.textContent = WAIT.length + "名にご案内を送りました";
    var html = "";
    WAIT.forEach(function(w, i){
      html += '<div class="ov-row in" style="animation-delay:' + (i * 0.16).toFixed(2) + 's">'
        + '<span class="ov-rank">' + (i + 1) + "</span>"
        + '<span class="ov-nm">' + esc(w.nm) + "<em>" + w.ag + " 歳</em></span>"
        + '<span class="ov-st" id="ovst' + i + '">送信</span>'
        + "</div>";
    });
    ovlist.innerHTML = html;
  }, 2600);

  // 4) 4.6秒後：1位が承諾
  later(function(){
    ovmsg.textContent = WAIT[0].nm + " 様が承諾しました";
    var st = document.getElementById("ovst0");
    if (st){ st.textContent = "確定"; st.className = "ov-st ok"; }
  }, 4600);

  // 5) 5.9秒後：予約表に戻り、枠が埋まる
  later(function(){
    over.classList.remove("on");
    a.state = "booked";
    a.nm = WAIT[0].nm;
    a.ag = WAIT[0].ag;
    a.ty = "chiryo";
    a.auto = true;
    a.anim = "fillin";
    a.flash = true;
    a.memo = "左上6番 C2。前回はう蝕検知液で範囲を確認し、暫間充填まで実施。本日コンポジットレジンの充填を予定。";
    state.filled = true;
    state.cancelled = true;
    renderBoard();
    scrollToNow();
    renderWait();
    document.getElementById("waitbadge").textContent = "4";
    toast("15:00 の枠が埋まりました（所要 2分）");
    running = false;
  }, 5900);
}

/* ====== 初期表示 ====== */
var boardwrap = document.getElementById("boardwrap");
function scrollToNow(){
  boardwrap.scrollTop = Math.max(0, y(NOW_MIN) - 150);
}
renderBoard();
renderWait();
renderRecall();
scrollToNow();
</script>
