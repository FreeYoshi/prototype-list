<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>送迎きろく</title>
<style>
:root{
  --ink:#22262B;
  --bg:#F1EFE9;
  --panel:#FFFFFF;
  --nav:#34302C;
  --nav-2:#464039;
  --am:#DE8A28;
  --am-bg:#FBF1E2;
  --pm:#54639C;
  --pm-bg:#EDEFF7;
  --ok:#3B7F5B;
  --ok-bg:#E9F2ED;
  --warn:#B94A32;
  --warn-bg:#FAEEEB;
  --muted:#6F6A65;
  --line:#DBD6CD;
  --line-2:#EBE7E0;
  --ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono","Hiragino Sans","Yu Gothic",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--ui);
  font-size:15px;
  line-height:1.65;
  color:var(--ink);
  background:var(--bg);
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.mono{font-family:var(--mono)}

/* ---------- 骨組み ---------- */
.app{display:flex;align-items:flex-start;min-height:100vh}
.side{
  width:222px;flex:0 0 222px;
  background:var(--nav);color:#EDE8E1;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
}
.brand{padding:18px 16px 12px;display:flex;gap:10px;align-items:center}
.logo{
  width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:var(--am);
  display:flex;align-items:center;justify-content:center;
}
.brand-t{font-weight:700;font-size:16px;letter-spacing:.04em;line-height:1.3;color:#fff}
.brand-sub{padding:0 16px 14px;font-size:12.5px;color:#A79E93;border-bottom:1px solid #45403A}
.nav{flex:1;min-height:0;overflow-y:auto;padding:12px 10px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:10px 12px;margin-bottom:3px;border:0;border-radius:9px;
  background:transparent;color:#CFC7BC;font-size:14.5px;text-align:left;cursor:pointer;
}
.nav-item:hover{background:var(--nav-2);color:#fff}
.nav-item.active{background:var(--nav-2);color:#fff;font-weight:700}
.nav-item svg{flex:0 0 18px}
.side-foot{padding:12px 16px 16px;border-top:1px solid #45403A;font-size:12.5px;color:#A79E93}
.side-foot b{display:block;color:#EDE8E1;font-size:13.5px;font-weight:600}

.main{flex:1;min-width:0}
.head{
  background:var(--panel);border-bottom:1px solid var(--line);
  padding:16px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
}
.head h1{margin:0;font-size:19px;letter-spacing:.02em}
.head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.head-act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.content{padding:20px 22px 70px;max-width:1260px}

/* ---------- 部品 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow:hidden}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card-h h2{margin:0;font-size:15.5px}
.card-h .sub{font-size:12.5px;color:var(--muted)}
.card-h .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card-b{padding:16px}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:14px;cursor:pointer;white-space:nowrap;
}
.btn:hover{background:#F7F4EF}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn-dark{background:var(--nav);border-color:var(--nav);color:#fff}
.btn-dark:hover{background:var(--nav-2)}
.btn-am{background:var(--am);border-color:var(--am);color:#fff;font-weight:700}
.btn-am:hover{background:#C87A1E}
.btn-pm{background:var(--pm);border-color:var(--pm);color:#fff;font-weight:700}
.btn-pm:hover{background:#48568B}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-ok:hover{background:#336F4F}
.btn-danger{background:var(--panel);border-color:#D9AFA4;color:var(--warn)}
.btn-danger:hover{background:var(--warn-bg)}
.btn-line{width:100%;justify-content:center;padding:11px 14px;color:#4A453F}
.btn-link{border:0;background:transparent;color:var(--pm);font-size:13px;padding:6px 2px;cursor:pointer;text-decoration:underline}
.btn-link:hover{color:#3C4874}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn:disabled:hover{background:var(--panel)}
.btn-am:disabled:hover{background:var(--am)}
.btn-pm:disabled:hover{background:var(--pm)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill-am{background:var(--am);color:#fff}
.pill-pm{background:var(--pm);color:#fff}
.pill-ok{background:var(--ok-bg);color:var(--ok);border:1px solid #BFDDCD}
.pill-idle{background:#EDE9E2;color:var(--muted);border:1px solid var(--line)}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:#F0ECE4;border:1px solid var(--line);font-size:12px;color:#5A544E;white-space:nowrap}
.tag-move{background:var(--am-bg);border-color:#EBD6B4;color:#8A5B14}

.note{padding:10px 13px;border-radius:9px;font-size:13.5px;border-left:4px solid var(--line);background:#F7F5F1;color:#4A453F}
.note-ok{background:var(--ok-bg);border-left-color:var(--ok);color:#2E6448}
.note-warn{background:var(--warn-bg);border-left-color:var(--warn);color:#8E3A27}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}

/* ---------- 大ボタン ---------- */
.bigrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.big{
  display:flex;gap:14px;align-items:center;text-align:left;
  padding:18px;border-radius:12px;border:1px solid var(--line);cursor:pointer;
}
.big-am{background:var(--am-bg);border-color:#EAD6B2}
.big-am:hover{background:#F7E9D2}
.big-pm{background:var(--pm-bg);border-color:#CFD5EA}
.big-pm:hover{background:#E2E6F3}
.big i{width:46px;height:46px;flex:0 0 46px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.big-am i{background:var(--am)}
.big-pm i{background:var(--pm)}
.big b{display:block;font-size:16.5px}
.big span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

/* ---------- 便カード ---------- */
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.trip{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}
.trip-h{padding:11px 13px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line-2)}
.trip-h .nm{font-weight:700}
.trip-h .no{font-family:var(--mono);font-size:12px;color:var(--muted)}
.trip-h .pill{margin-left:auto}
.trip-meta{display:flex;flex-wrap:wrap;gap:4px 14px;padding:9px 13px;background:#FAF8F4;border-bottom:1px solid var(--line-2);font-size:12.5px;color:var(--muted)}
.trip-meta b{color:var(--ink);font-weight:600}
.trip-meta .mono{color:var(--ink)}
.rider{display:flex;gap:8px;align-items:center;padding:8px 13px;border-bottom:1px solid var(--line-2);font-size:14px}
.rider:last-child{border-bottom:0}
.rider .rn{font-weight:600}
.rider .rt{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ok);font-weight:700}
.rider .rt.non{color:#A9A29A;font-weight:400}
.trip-f{padding:11px 13px;border-top:1px solid var(--line-2);display:flex;gap:8px;flex-wrap:wrap;background:#FAF8F4}
.vinfo{padding:11px 13px;font-size:13px;color:var(--muted)}
.vinfo .mono{color:var(--ink)}

/* ---------- 表 ---------- */
.tw{overflow:auto;max-height:560px;border:1px solid var(--line-2);border-radius:10px}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;font-size:13.5px;background:var(--panel)}
table.grid th,table.grid td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:left;white-space:nowrap}
table.grid thead th{
  position:sticky;top:0;z-index:3;background:#F3F0EA;border-bottom:1px solid var(--line);
  font-size:12.5px;font-weight:700;color:#4A453F;
}
table.grid thead th.am{background:#F4E3C8}
table.grid thead th.pm{background:#DCE1F0}
table.grid td.am{background:#FCF6EC}
table.grid td.pm{background:#F4F6FC}
table.grid td.stick,table.grid th.stick{
  position:sticky;left:0;z-index:2;background:var(--panel);
  border-right:2px solid var(--line);font-weight:600;
}
table.grid thead th.stick{z-index:4;background:#F3F0EA}
table.grid tbody tr:hover td{background:#F8F6F2}
table.grid tbody tr:hover td.am{background:#F8EEDD}
table.grid tbody tr:hover td.pm{background:#EAEDF7}
table.grid tbody tr:hover td.stick{background:#F8F6F2}
table.grid td.off{background:#F2F0EC;color:var(--muted)}
table.grid tbody tr:hover td.off{background:#EDEAE4}
table.grid tr.absent td.stick{background:#F5F3EF}
table.grid tbody tr.absent:hover td.stick{background:#F1EEE8}
.dash{color:#B6B0A8}
.wrapcell{white-space:normal;min-width:190px;color:var(--muted);font-size:12.5px}
.rowlink{cursor:pointer}
.rowlink.on td{background:#F1EEE7}
.actcell{display:flex;gap:6px}

/* ---------- 検索フォーム ---------- */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
}
.fld textarea{min-height:74px;resize:vertical}
.fld input:disabled,.fld select:disabled{background:#F4F1EC;color:#A9A29A}
.formact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ---------- 詳細 ---------- */
.detail{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-top:16px;overflow:hidden}
.detail-h{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.detail-h h3{margin:0;font-size:16px}
.dcols{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px}
.dcard{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dcard-h{padding:9px 13px;font-weight:700;font-size:14px}
.dcard-h.am{background:var(--am-bg);color:#8A5B14;border-bottom:1px solid #EBD6B4}
.dcard-h.pm{background:var(--pm-bg);color:#3C4874;border-bottom:1px solid #CFD5EA}
.dcard.abs{grid-column:1 / -1;border-left:3px solid var(--muted)}
.dcard-h.abs{background:var(--line-2);color:#4A453F;border-bottom:1px solid var(--line)}
dl.kv{margin:0;padding:12px 13px;display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:13.5px}
dl.kv dt{color:var(--muted);font-size:12.5px;padding-top:1px}
dl.kv dd{margin:0}

/* ---------- モーダル ---------- */
.mask{position:fixed;inset:0;background:rgba(30,26,22,.44);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:720px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.modal-h{padding:15px 18px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;align-items:center}
.modal-h h2{margin:0;font-size:17px}
.modal-h .date{font-family:var(--mono);font-size:13px;color:var(--muted)}
.modal-h .x{margin-left:auto;border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:8px}
.modal-h .x:hover{background:#F2EFE9}
.modal-b{padding:18px;overflow-y:auto}
.modal-f{padding:14px 18px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;background:#FAF8F4}
.step{margin-bottom:20px}
.step-h{display:flex;gap:9px;align-items:center;margin-bottom:9px}
.step-n{width:23px;height:23px;flex:0 0 23px;border-radius:999px;background:var(--nav);color:#fff;font-family:var(--mono);font-size:13px;display:flex;align-items:center;justify-content:center}
.step-h b{font-size:14.5px}
.step-h .cnt{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}
.step p.hint{margin:0 0 9px 32px;font-size:12.5px;color:var(--muted)}
.step-b{margin-left:32px}
.chips{display:flex;gap:9px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);border-radius:10px;background:var(--panel);
  padding:9px 13px;text-align:left;cursor:pointer;min-width:150px;
}
.chip:hover{background:#F7F4EF}
.chip b{display:block;font-size:14.5px}
.chip span{display:block;font-size:11.5px;color:var(--muted)}
.chip.on{border-color:var(--nav);background:#F3F0EA;box-shadow:inset 0 0 0 1px var(--nav)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip:disabled:hover{background:var(--panel)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.pick{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;background:var(--panel)}
.pick:hover{background:#F7F4EF}
.pick.on{border-color:var(--nav);background:#F3F0EA}
.pick.course{border-left:3px solid var(--ok)}
.pick.dim{background:#FAF8F4}
.pick.dis{opacity:.55;cursor:not-allowed}
.pick input{margin-top:4px;width:16px;height:16px;flex:0 0 16px}
.pick b{display:block;font-size:14px}
.pick span{display:block;font-size:11.5px;color:var(--muted)}
.pick .tag{display:none;margin-top:3px}
.pick.on .tag,.pick.dis .tag{display:inline-block}
.abs-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 13px;border-bottom:1px solid var(--line-2);font-size:14px}
.abs-row:last-child{border-bottom:0}
.abs-row .nm{font-weight:600;min-width:110px}
.abs-row .at{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.abs-row .rest{margin-left:auto}
.abs-row .memo{flex:1 0 100%;font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal.wide{max-width:1000px}
.sheetwrap{overflow-x:auto;background:#EDEAE4;padding:14px;border-radius:10px}
.sheet{background:#fff;color:#000;min-width:880px;padding:22px 24px;border:1px solid var(--line)}
.sheet h1{text-align:center;font-size:17px;margin:0 0 12px;letter-spacing:.14em;font-weight:700}
.sheet .pmeta{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:8px}
.sheet table{border-collapse:collapse;width:100%}
.sheet th,.sheet td{border:1px solid #000;padding:4px 6px;text-align:left;font-size:11.5px;white-space:nowrap}
.sheet th{background:#EEE;text-align:center}
.sheet tr.absent td{background:#D6D3CE}
.sheet .absnote{margin-top:10px;font-size:12px}
.sheet .seals{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.sheet .seal{width:92px;border:1px solid #000}
.sheet .seal .st{border-bottom:1px solid #000;text-align:center;font-size:11px;padding:2px}
.sheet .seal .sb{height:58px}

/* ---------- トースト ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--am);
  border-radius:10px;padding:12px 18px;font-size:14px;max-width:92vw;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}

/* ---------- 印刷 ---------- */
#printRoot{display:none}
@page{size:A4 landscape;margin:12mm}
@media print{
  html,body{background:#fff}
  .app,.mask,.toast{display:none !important}
  #printRoot{display:block;color:#000;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printRoot tr.absent td{background:#D6D3CE}
  #printRoot .absnote{margin-top:10px;font-size:11px}
  #printRoot h1{text-align:center;font-size:16px;margin:0 0 10px;letter-spacing:.14em}
  #printRoot .pmeta{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:6px}
  #printRoot table{border-collapse:collapse;width:100%}
  #printRoot th,#printRoot td{border:1px solid #000;padding:3px 5px;text-align:left;font-size:10.5px}
  #printRoot th{background:#EEE;text-align:center}
  #printRoot .seals{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
  #printRoot .seal{width:78px;border:1px solid #000}
  #printRoot .seal .st{border-bottom:1px solid #000;text-align:center;font-size:10px;padding:2px}
  #printRoot .seal .sb{height:52px}
}

/* ---------- レスポンシブ ---------- */
@media (max-width:899px){
  .app{display:block}
  .side{
    width:auto;flex:none;height:auto;position:sticky;top:0;z-index:50;
    flex-direction:row;align-items:center;gap:6px;padding:8px 10px;
  }
  .brand{padding:0 4px 0 0;flex:0 0 auto}
  .brand-t{font-size:14px;white-space:nowrap}
  .brand-sub,.side-foot{display:none}
  .nav{display:flex;gap:6px;padding:0;overflow-x:auto;overflow-y:hidden;flex:1;min-width:0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav-item{width:auto;flex:0 0 auto;margin:0;padding:8px 11px;font-size:13.5px}
  .nav-item .nav-label{display:none}
  .nav-item.active .nav-label{display:inline}
  .head{padding:14px 16px}
  .content{padding:16px 16px 60px}
  .dcols{grid-template-columns:1fr}
}
@media (max-width:639px){
  .bigrow{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .mask{padding:0;align-items:flex-end}
  .modal{max-width:none;max-height:92vh;border-radius:14px 14px 0 0}
  .modal-b{padding:16px 14px}
  .step-b,.step p.hint{margin-left:0}
  .head-act{margin-left:0;width:100%}
}
</style>

<div id="app" class="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="printRoot"></div>

var COURSES = {
  v1:{staffId:'s5', users:['u1','u2','u3','u4']},

/* 当日欠席。{id, date, userId, slot, reason, note, at}
   slot は day（終日欠席）/ am（朝のみ来ない）/ pm（夕のみ帰らない） */
var ABSENCES = [];
var REASONS = ['体調不良','受診','家族都合','入院','その他'];

var ME = {name:'田中 誠', role:'管理者'};

/* =========================================================================
   小さな道具
   ========================================================================= */
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pad2(n){ return (n<10?'0':'')+n; }
function toMin(hm){
  if(!hm) return 0;
  var p = String(hm).split(':');
  return parseInt(p[0],10)*60 + parseInt(p[1],10);
}
function fromMin(m){
  var x = ((m % 1440) + 1440) % 1440;      /* 24時間をまたいでも破綻しない */
  return pad2(Math.floor(x/60)) + ':' + pad2(x%60);
}
function addMin(hm, n){ return fromMin(toMin(hm) + n); }
function dkey(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
var WD = ['日','月','火','水','木','金','土'];
function parseKey(k){
  var p = k.split('-');
  return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
}
function fmtDate(k){
  var d = parseKey(k);
  return (d.getMonth()+1) + '月' + d.getDate() + '日（' + WD[d.getDay()] + '）';
}
function fmtDateShort(k){
  var d = parseKey(k);
  return (d.getMonth()+1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）';
}
function nowHM(){
  var d = new Date();
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
/* 曜日は日付文字列からDateを組み立てて判定する（日曜=0、月曜=1 … 土曜=6） */
function dowOf(dateKey){ return parseKey(dateKey).getDay(); }
function dowName(dateKey){ return WD[dowOf(dateKey)] + '曜'; }
function usesDay(u, dateKey){
  return !!u && !!u.days && u.days.indexOf(dowOf(dateKey)) >= 0;
}
function usersOfDay(dateKey){
  return USERS.filter(function(u){ return usesDay(u, dateKey); });
}
function daysLabel(u){
  if(!u.days || !u.days.length) return '';
  return u.days.slice().sort(function(a,b){ return a-b; }).map(function(n){ return WD[n]; }).join('・');
}
function byId(list, id){
  for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; }
  return null;
}
function vName(id){ var v=byId(VEHICLES,id); return v?v.name:'-'; }
function sName(id){ var s=byId(STAFF,id); return s?s.name:'-'; }
function uName(id){ var u=byId(USERS,id); return u?u.name:'-'; }
function slotLabel(slot){ return slot==='am' ? '朝の迎え' : '夕の送り'; }
function slotShort(slot){ return slot==='am' ? '朝' : '夕'; }
function rideWord(slot){ return slot==='am' ? '乗車' : '降車'; }
function closest(el, sel){
  while(el && el.nodeType===1){
    if(el.matches ? el.matches(sel) : el.msMatchesSelector(sel)) return el;
    el = el.parentNode;
  }
  return null;
}

/* =========================================================================
   初期データ（すべて実行日からの相対で生成する）
   ========================================================================= */
/* 画面に出す「本日」。日曜は休業日で送迎がないため、
   日曜に開いたときは翌営業日（月曜）を本日として表示する */
function businessToday(){
  var d = new Date();
  while(d.getDay() === 0){ d.setDate(d.getDate() + 1); }
  return dkey(d);
}
var TODAY = businessToday();
var TRIPS = [];
var seq = 1;
var absSeq = 1;

function makeTrip(dateKey, slot, vehicleId, depart, riderIds, status){
  var v = byId(VEHICLES, vehicleId);
  var t = {
    id: 'T' + (seq++),
    date: dateKey,
    slot: slot,
    vehicleId: vehicleId,
    staffId: COURSES[vehicleId].staffId,
    depart: depart,
    arrive: null,
    status: status,
    riders: []
  };
  for(var i=0;i<riderIds.length;i++){
    t.riders.push({userId: riderIds[i], time: null});
  }
  return t;
}

function fillTimes(t, gapStart){
  var cur = addMin(t.depart, gapStart);
  for(var i=0;i<t.riders.length;i++){
    t.riders[i].time = cur;
    cur = addMin(cur, (i % 2 === 0) ? 7 : 8);
  }
  var last = t.riders.length ? t.riders[t.riders.length-1].time : t.depart;
  t.arrive = addMin(last, t.slot==='am' ? 12 : 10);
}

/* その日その区分で実際に乗せる人。曜日の利用予定と欠席で絞る */
function ridersFor(vehicleId, dateKey, slot){
  return COURSES[vehicleId].users.filter(function(id){
    return usesDay(byId(USERS, id), dateKey) && !isAbsent(dateKey, id, slot);
  });
}

function seedAbsence(){
  var d = dowOf(TODAY);
  var a = (d===2 || d===4 || d===6)
    ? {userId:'u3', reason:'体調不良', note:'発熱のためご家族から連絡', at:'07:52'}
    : {userId:'u1', reason:'受診',     note:'かかりつけ医の定期受診',   at:'08:10'};
  /* その方が本日の利用予定でない曜日は、本日利用予定の方に振り替える */
  if(!usesDay(byId(USERS, a.userId), TODAY)){
    var today = usersOfDay(TODAY);
    if(!today.length) return;                /* 休業日は欠席を作らない */
    a.userId = today[0].id;
  }
  ABSENCES.push({
    id:'A' + (absSeq++), date:TODAY, userId:a.userId, slot:'day',
    reason:a.reason, note:a.note, at:a.at
  });
}

function buildInitialData(){
  /* 過去4営業日（日曜を除く） */
  var days = [];
  var d = parseKey(TODAY);
  while(days.length < 4){
    d.setDate(d.getDate() - 1);
    if(d.getDay() !== 0) days.push(dkey(d));
  }
  days.reverse();

  for(var di=0; di<days.length; di++){
    for(var vi=0; vi<VEHICLES.length; vi++){
      var vid = VEHICLES[vi].id;

      /* 土曜のように利用者が少ない日は、乗る人がいなければ便を立てない */
      var ar = ridersFor(vid, days[di], 'am');
      if(ar.length){
        var am = makeTrip(days[di], 'am', vid, addMin('08:05', (vi*3 + di*2) % 9), ar, 'done');
        fillTimes(am, 7);
        TRIPS.push(am);
      }
      var pr = ridersFor(vid, days[di], 'pm');
      if(pr.length){
        var pm = makeTrip(days[di], 'pm', vid, addMin('16:10', (vi*2 + di*3) % 8), pr, 'done');
        fillTimes(pm, 7);
        TRIPS.push(pm);
      }
    }
  }

  /* 本日の欠席を先に入れてから、その人を外して朝の便を作る */
  seedAbsence();

  /* 本日：朝の便は完了済み。夕はまだ未登録 */
  for(var k=0; k<VEHICLES.length; k++){
    var id = VEHICLES[k].id;
    var rs = ridersFor(id, TODAY, 'am');
    if(!rs.length) continue;
    var t = makeTrip(TODAY, 'am', id, addMin('08:05', k*3), rs, 'done');
    fillTimes(t, 7);
    TRIPS.push(t);
  }
}
buildInitialData();

/* =========================================================================
   参照系
   ========================================================================= */
function tripsOf(dateKey, slot){
  return TRIPS.filter(function(t){
    return t.date===dateKey && (!slot || t.slot===slot);
  });
}
function todayTrips(){
  return tripsOf(TODAY, null).sort(function(a,b){
    if(a.slot !== b.slot) return a.slot==='am' ? -1 : 1;
    return toMin(a.depart) - toMin(b.depart);
  });
}
function runningTrips(){
  return TRIPS.filter(function(t){ return t.status==='running'; });
}
function runningTripOf(vehicleId){
  var r = TRIPS.filter(function(t){ return t.status==='running' && t.vehicleId===vehicleId; });
  return r.length ? r[0] : null;
}
function tripFor(dateKey, slot, userId){
  var list = tripsOf(dateKey, slot);
  for(var i=0;i<list.length;i++){
    for(var j=0;j<list[i].riders.length;j++){
      if(list[i].riders[j].userId===userId) return {trip:list[i], rider:list[i].riders[j]};
    }
  }
  return null;
}
function registeredUserIds(dateKey, slot){
  var ids = [];
  tripsOf(dateKey, slot).forEach(function(t){
    t.riders.forEach(function(r){ ids.push(r.userId); });
  });
  return ids;
}
function lastArriveToday(vehicleId){
  var list = TRIPS.filter(function(t){
    return t.date===TODAY && t.vehicleId===vehicleId && t.status==='done' && t.arrive;
  }).sort(function(a,b){ return toMin(b.arrive) - toMin(a.arrive); });
  return list.length ? list[0].arrive : null;
}
function unrecordedCount(t){
  return t.riders.filter(function(r){ return !r.time; }).length;
}

/* ---- 欠席 ---- */
function absencesOf(dateKey){
  return ABSENCES.filter(function(a){ return a.date===dateKey; });
}
function absenceOf(dateKey, userId){
  var l = ABSENCES.filter(function(a){ return a.date===dateKey && a.userId===userId; });
  return l.length ? l[0] : null;
}
function isAbsent(dateKey, userId, slot){
  var a = absenceOf(dateKey, userId);
  if(!a) return false;
  return a.slot==='day' || a.slot===slot;
}
function rangeLabel(slot){
  return slot==='day' ? '終日おやすみ' : (slot==='am' ? '朝だけ来られない' : '夕だけお迎えなし');
}
function rangeShort(slot){
  return slot==='day' ? '終日欠席' : (slot==='am' ? '朝欠席' : '夕欠席');
}
/* 本日の送迎表に出す利用者。曜日の利用予定に加え、記録や欠席がある方も出す */
function todayRows(){
  return USERS.filter(function(u){
    return usesDay(u, TODAY) || absenceOf(TODAY, u.id) ||
           tripFor(TODAY,'am',u.id) || tripFor(TODAY,'pm',u.id);
  });
}

/* =========================================================================
   画面3：送迎記録の検索
   ========================================================================= */
function searchRecords(){
  var out = [];
  TRIPS.forEach(function(t){
    if(searchCond.date && t.date !== searchCond.date) return;
    if(searchCond.slot && t.slot !== searchCond.slot) return;
    if(searchCond.staffId && t.staffId !== searchCond.staffId) return;
    if(searchCond.vehicleId && t.vehicleId !== searchCond.vehicleId) return;
    t.riders.forEach(function(r){
      var u = byId(USERS, r.userId);
      if(searchCond.name){
        var q = searchCond.name;
        var hit = u && ((u.name.indexOf(q) >= 0) || (u.kana.indexOf(q) >= 0));
        if(!hit) return;
      }
      out.push({trip:t, rider:r, user:u});
    });
  });
  out.sort(function(a,b){
    if(a.trip.date !== b.trip.date) return a.trip.date < b.trip.date ? 1 : -1;
    if(a.trip.slot !== b.trip.slot) return a.trip.slot==='am' ? -1 : 1;
    return toMin(a.trip.depart) - toMin(b.trip.depart);
  });
  return out;
}

/* 区分に「欠席」を選んだときは欠席記録を探す（日付と利用者名で絞る） */
function searchAbsences(){
  var out = ABSENCES.filter(function(a){
    if(searchCond.date && a.date !== searchCond.date) return false;
    if(searchCond.name){
      var u = byId(USERS, a.userId);
      var q = searchCond.name;
      if(!u || (u.name.indexOf(q) < 0 && u.kana.indexOf(q) < 0)) return false;
    }
    return true;
  });
  out.sort(function(a,b){
    if(a.date !== b.date) return a.date < b.date ? 1 : -1;
    return toMin(a.at) - toMin(b.at);
  });
  return out;
}

         ico(n.icon, 'currentColor', 18) + '<span class="nav-label">' + esc(n.label) + '</span></button>';
  }

  }else if(view==='live'){
    h += '<button class="btn" data-act="nav" data-view="today">本日の送迎へ戻る</button>';
  }else if(view==='search'){
    h += '<button class="btn" data-act="do-search">この条件で検索</button>';
  }

  h += '<div class="content">';
  if(view==='today')       h += viewToday();
  else if(view==='live')   h += viewLive();
  else if(view==='search') h += viewSearch();

  else                     h += viewStaff();

  document.getElementById('app').innerHTML = h;
  renderModal();
}

function renderModal(){
  var root = document.getElementById('modalRoot');
  if(!modal){ root.innerHTML = ''; return; }
  var h = '<div class="mask" data-act="mask"><div class="modal' + (modal==='sheet' ? ' wide' : '') +
          '" role="dialog" aria-modal="true">';

  else if(modal==='abs')     h += absModalHtml();
  else if(modal==='absList') h += absListHtml();

}
function closeModal(){ modal = null; rec = null; form = null; abs = null; renderModal(); }

/* ---- 記録モーダル ---- */
function openRec(slot, vehicleId){
  rec = {slot:slot, vehicleId:'', depart:'', staffId:'', picked:[], showAll:false};
  modal = 'rec';
  if(vehicleId) pickVehicle(vehicleId);
  else renderModal();
}
function pickVehicle(id){
  if(runningTripOf(id)) return;
  rec.vehicleId = id;
  rec.depart = nowHM();                       /* 車を選んだ瞬間に時刻が入る */
  rec.staffId = COURSES[id] ? COURSES[id].staffId : '';
  renderModal();
}
/* 登録済み・欠席の方を除いた、その日に選べる利用者 */
function recAvailable(){
  var used = registeredUserIds(TODAY, rec.slot);
  return USERS.filter(function(u){
    return used.indexOf(u.id) < 0 && !isAbsent(TODAY, u.id, rec.slot);
  });
}
function recCandidates(){                        /* 本日の利用予定がある方 */
  return recAvailable().filter(function(u){ return usesDay(u, TODAY); });
}
function recExtra(){                             /* 本日は利用予定のない方 */
  return recAvailable().filter(function(u){ return !usesDay(u, TODAY); });
}
function courseRest(){
  if(!rec.vehicleId || !COURSES[rec.vehicleId]) return [];
  var used = registeredUserIds(TODAY, rec.slot);
  return COURSES[rec.vehicleId].users.filter(function(id){
    return used.indexOf(id) < 0 && usesDay(byId(USERS,id), TODAY) && !isAbsent(TODAY, id, rec.slot);
  });
}

/* 印刷イメージを画像に描き出す（枠内から印刷できない環境でも持ち帰れるように） */
function sheetCanvas(){
  var UI = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif';
  var W = 1754, H = 1240, M = 76;
  var cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  var g = cv.getContext('2d');
  g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#000000';
  g.textBaseline = 'middle';

  g.font = '700 34px ' + UI;
  g.textAlign = 'center';
  g.fillText('送迎記録（車両運行記録）', W/2, M + 16);
  g.font = '20px ' + UI;
  g.textAlign = 'left';
  g.fillText(OFFICE.corp + '　' + OFFICE.name, M, M + 68);
  g.textAlign = 'right';
  g.fillText(fmtDate(TODAY), W - M, M + 68);

  var raw = [190, 210, 118, 118, 132, 160, 118, 118, 132, 160];
  var sum = 0, i;
  for(i=0;i<raw.length;i++) sum += raw[i];
  var scale = (W - M*2) / sum;
  var cw = raw.map(function(n){ return Math.round(n * scale); });
  var x0 = M, y0 = M + 100, rh = 34;

  function colX(idx){
    var x = x0;
    for(var k=0;k<idx;k++) x += cw[k];
    return x;
  }
  function box(x, y, w, h, fill){
    if(fill){ g.fillStyle = fill; g.fillRect(x, y, w, h); g.fillStyle = '#000000'; }
    g.strokeStyle = '#000000'; g.lineWidth = 1;
    g.strokeRect(x + .5, y + .5, w, h);
  }
  function cell(x, y, w, h, text, align, fill){
    box(x, y, w, h, fill);
    if(!text) return;
    g.font = '17px ' + UI;
    if(align === 'center'){ g.textAlign = 'center'; g.fillText(text, x + w/2, y + h/2 + 1); }
    else { g.textAlign = 'left'; g.fillText(text, x + 8, y + h/2 + 1); }
  }

  /* 見出し2段 */
  cell(colX(0), y0, cw[0], rh*2, '利用者', 'center', '#EEEEEE');
  cell(colX(1), y0, cw[1], rh*2, '地区',   'center', '#EEEEEE');
  var amW = cw[2]+cw[3]+cw[4]+cw[5], pmW = cw[6]+cw[7]+cw[8]+cw[9];
  cell(colX(2), y0, amW, rh, '朝の迎え', 'center', '#EEEEEE');
  cell(colX(6), y0, pmW, rh, '夕の送り', 'center', '#EEEEEE');
  var sub = ['出発','乗車','車両','担当者','出発','降車','車両','担当者'];
  for(i=0;i<8;i++) cell(colX(i+2), y0+rh, cw[i+2], rh, sub[i], 'center', '#EEEEEE');

  /* 明細 */
  var rows = todayRows();
  var y = y0 + rh*2;
  for(i=0;i<rows.length;i++){
    var u = rows[i];
    var am = tripFor(TODAY,'am',u.id);
    var pm = tripFor(TODAY,'pm',u.id);
    var ab = absenceOf(TODAY, u.id);
    var bg = (ab && ab.slot==='day') ? '#D6D3CE' : null;
    var v = [
      u.name, u.area,
      isAbsent(TODAY,u.id,'am') ? '欠席' : (am ? am.trip.depart : ''),
      isAbsent(TODAY,u.id,'am') ? '欠席' : (am && am.rider.time ? am.rider.time : ''),

      isAbsent(TODAY,u.id,'pm') ? '' : (pm ? vName(pm.trip.vehicleId) : ''),
      isAbsent(TODAY,u.id,'pm') ? '' : (pm ? sName(pm.trip.staffId) : '')
    ];

    var cnt = {}, parts = [];
    abl.forEach(function(a){ cnt[a.reason] = (cnt[a.reason]||0) + 1; });
    for(var key in cnt){ if(cnt.hasOwnProperty(key)) parts.push(key + cnt[key]); }

  /* 押印欄 */
  var sw = 150, sh = 34, sb = 92, sy = y + 56;
  var labels = ['管理者','確認者'];
  for(i=0;i<2;i++){

  }
  return cv;
}

function csvCell(v){
  var s = (v===null||v===undefined) ? '' : String(v);
  if(s.indexOf('"')>=0 || s.indexOf(',')>=0 || s.indexOf('\n')>=0){
    return '"' + s.replace(/"/g,'""') + '"';
  }
  return s;
}
function saveLocal(text, filename){
  var blob = new Blob([text], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}
function download(rows, filename, okMsg){
  var lines = rows.map(function(r){
    return r.map(csvCell).join(',');
  }).join('\r\n');
  var bom = String.fromCharCode(0xFEFF);
  var text = bom + lines;                 /* BOM必須。無いとExcelで文字化けする */

  /* 共有ページで開いているときは、ブラウザの保存確認を通して書き出す */
  if(typeof claude !== 'undefined' && claude && typeof claude.use === 'function'){
    claude.use('downloads').then(function(dl){
      if(!dl){ saveLocal(text, filename); toast(okMsg); return; }
      return dl.save({filename:filename, data:text}).then(function(){
        toast(okMsg);
      })['catch'](function(e){
        var code = e && e.code;
        if(code === 'declined'){ toast('書き出しを取り消しました'); return; }
        if(code === 'extension_not_enabled'){
          return dl.save({filename:filename.replace(/\.csv$/, '.txt'), data:text}).then(function(){
            toast(okMsg + '（テキスト形式。Excelで開けます）');
          })['catch'](function(){
            toast('書き出しできませんでした。もう一度お試しください。');
          });
        }
        saveLocal(text, filename);
        toast(okMsg);
      });
    })['catch'](function(){ saveLocal(text, filename); toast(okMsg); });
    return;
  }
  saveLocal(text, filename);
  toast(okMsg);
}

function usedInTrips(kind, id){
  for(var i=0;i<TRIPS.length;i++){
    var t = TRIPS[i];
    if(kind==='veh' && t.vehicleId===id) return true;
    if(kind==='stf' && t.staffId===id) return true;
    if(kind==='usr'){
      for(var j=0;j<t.riders.length;j++){ if(t.riders[j].userId===id) return true; }
    }
  }
  return false;
}
function confirmDelete(kind, name, id){
  if(usedInTrips(kind, id)){
    return window.confirm(name + ' は過去の送迎記録で使われています。削除すると記録の表示に影響します。それでも削除しますか。');
  }
  return window.confirm(name + ' を削除します。よろしいですか。');
}
function removeById(list, id){
  for(var i=0;i<list.length;i++){ if(list[i].id===id){ list.splice(i,1); return; } }
}
function newId(prefix, list){
  var n = 1;
  while(byId(list, prefix + n)) n++;
  return prefix + n;
}

document.addEventListener('click', function(e){
  var el = closest(e.target, '[data-act]');
  if(!el) return;
  var act = el.getAttribute('data-act');

  if(act==='mask'){ if(e.target===el) closeModal(); return; }
  if(act==='close-modal'){ closeModal(); return; }

  if(act==='nav'){ view = el.getAttribute('data-view'); render(); return; }

  /* 記録モーダル */
  if(act==='open-rec'){ openRec(el.getAttribute('data-slot'), null); return; }
  if(act==='go-out'){
    /* 朝がまだ1本も出ていなければ朝の迎え、出ていれば夕の送りとして開く */
    var slot0 = tripsOf(TODAY,'am').length ? 'pm' : 'am';
    openRec(slot0, el.getAttribute('data-veh'));
    return;
  }
  if(act==='pick-veh'){ pickVehicle(el.getAttribute('data-id')); return; }
  if(act==='pick-user'){
    var id = el.getAttribute('data-id');
    var p = rec.picked.indexOf(id);
    if(p>=0) rec.picked.splice(p,1); else rec.picked.push(id);
    syncPickUI();
    return;
  }
  if(act==='show-all'){ rec.showAll = true; renderModal(); return; }
  if(act==='pick-course'){
    var rest = courseRest();
    for(var i=0;i<rest.length;i++){
      if(rec.picked.indexOf(rest[i]) < 0) rec.picked.push(rest[i]);
    }
    syncPickUI();
    return;
  }
  if(act==='submit-rec'){ submitRec(); return; }

  /* 欠席 */
  if(act==='open-abs'){ openAbs(); return; }
  if(act==='open-abs-list'){ modal = 'absList'; renderModal(); return; }
  if(act==='abs-pick'){
    var aid = el.getAttribute('data-id');
    var ap = abs.picked.indexOf(aid);
    if(ap>=0) abs.picked.splice(ap,1); else abs.picked.push(aid);
    syncAbsUI();
    return;
  }
  if(act==='abs-range'){
    readAbsNote();
    abs.slot = el.getAttribute('data-range');
    /* 範囲を変えて登録できなくなった方は選択から外す */
    abs.picked = abs.picked.filter(function(id){ return !absBlocked(id); });
    renderModal();
    return;
  }
  if(act==='abs-reason'){ readAbsNote(); abs.reason = el.getAttribute('data-reason'); renderModal(); return; }
  if(act==='submit-abs'){ submitAbs(); return; }
  if(act==='abs-cancel'){
    var a2 = byId(ABSENCES, el.getAttribute('data-id'));
    if(!a2) return;
    if(!window.confirm(uName(a2.userId) + ' 様の欠席を取り消します。よろしいですか。')) return;
    removeById(ABSENCES, a2.id);
    render();
    if(absencesOf(TODAY).length) renderModal(); else closeModal();
    toast(uName(a2.userId) + ' 様の欠席を取り消しました');
    return;
  }

  /* 運行状況 */
  if(act==='ride'){
    var t = byId(TRIPS, el.getAttribute('data-trip'));
    if(!t) return;
    var uid = el.getAttribute('data-user');
    var hm = nowHM();
    for(var k=0;k<t.riders.length;k++){
      if(t.riders[k].userId===uid){ t.riders[k].time = hm; }
    }
    render();
    toast(uName(uid) + ' 様の' + rideWord(t.slot) + 'を ' + hm + ' で記録しました');
    return;
  }
  if(act==='arrive'){
    var t2 = byId(TRIPS, el.getAttribute('data-trip'));
    if(!t2) return;
    var rest2 = unrecordedCount(t2);
    if(rest2 > 0){
      if(!window.confirm(rest2 + '名がまだ未記録です。このまま帰着として記録しますか。')) return;
    }
    t2.status = 'done';
    t2.arrive = nowHM();
    render();
    toast(vName(t2.vehicleId) + ' の帰着を ' + t2.arrive + ' で記録しました');
    return;
  }
  if(act==='cancel'){
    var t3 = byId(TRIPS, el.getAttribute('data-trip'));
    if(!t3) return;
    if(!window.confirm(vName(t3.vehicleId) + ' の' + slotLabel(t3.slot) + 'を取り消します。記録は残りません。よろしいですか。')) return;
    removeById(TRIPS, t3.id);
    render();
    toast('この便を取り消しました');
    return;
  }

  /* 検索 */
  if(act==='do-search'){
    view = 'search';
    readCond();
    searchDone = true;
    detail = null;
    render();
    return;
  }
  if(act==='clear-search'){
    searchCond = {date:'', slot:'', staffId:'', vehicleId:'', name:''};
    searchDone = false; detail = null;
    render();
    return;
  }
  if(act==='csv-search'){ readCond(); csvSearch(); return; }
  if(act==='open-detail'){
    detail = {date: el.getAttribute('data-date'), userId: el.getAttribute('data-user')};
    render();
    var box = document.getElementById('detailBox');
    if(box && box.scrollIntoView) box.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  if(act==='close-detail'){ detail = null; render(); return; }

  /* 出力 */
  if(act==='print-today'){ printToday(); return; }
  if(act==='save-sheet'){ saveSheet(); return; }
  if(act==='csv-today'){ csvToday(); return; }

  /* 車両 */
  if(act==='veh-new'){
    form = {id:'', name:'', number:'', model:'', cap:8, lift:false};
    modal = 'veh'; renderModal(); return;
  }
  if(act==='veh-edit'){
    var v = byId(VEHICLES, el.getAttribute('data-id'));
    if(!v) return;
    form = {id:v.id, name:v.name, number:v.number, model:v.model, cap:v.cap, lift:v.lift};
    modal = 'veh'; renderModal(); return;
  }
  if(act==='veh-del'){
    var v2 = byId(VEHICLES, el.getAttribute('data-id'));
    if(!v2) return;
    if(!confirmDelete('veh', v2.name, v2.id)) return;
    removeById(VEHICLES, v2.id);
    delete COURSES[v2.id];
    render(); toast(v2.name + ' を削除しました');
    return;
  }
  if(act==='save-veh'){
    var nm = val('m-name').replace(/^\s+|\s+$/g,'');
    if(!nm){ window.alert('呼称を入力してください。'); return; }
    var cap = parseInt(val('m-cap'),10); if(isNaN(cap)||cap<1) cap = 1;
    var lift = val('m-lift')==='1';
    if(form.id){
      var tv = byId(VEHICLES, form.id);
      tv.name = nm; tv.number = val('m-number'); tv.model = val('m-model'); tv.cap = cap; tv.lift = lift;
    }else{
      var nid = newId('v', VEHICLES);
      VEHICLES.push({id:nid, name:nm, number:val('m-number'), model:val('m-model'), cap:cap, lift:lift});
      COURSES[nid] = {staffId: STAFF.length?STAFF[0].id:'', users:[]};
    }
    closeModal(); render(); toast(nm + ' を保存しました');
    return;
  }

  /* 利用者 */
  if(act==='usr-new'){
    form = {id:'', name:'', kana:'', age:'', area:'', tel:'', move:'自立', days:[], note:''};
    modal = 'usr'; renderModal(); return;
  }
  if(act==='usr-edit'){
    var u = byId(USERS, el.getAttribute('data-id'));
    if(!u) return;
    form = {id:u.id, name:u.name, kana:u.kana, age:u.age, area:u.area, tel:u.tel,
            move:u.move, days:(u.days||[]).slice(), note:u.note};
    modal = 'usr'; renderModal(); return;
  }
  if(act==='toggle-day'){
    var dn = parseInt(el.getAttribute('data-day'), 10);
    var dp = form.days.indexOf(dn);
    if(dp >= 0) form.days.splice(dp,1); else form.days.push(dn);
    var nowOn = form.days.indexOf(dn) >= 0;
    el.className = 'chip' + (nowOn ? ' on' : '');
    el.setAttribute('aria-pressed', nowOn ? 'true' : 'false');
    return;
  }
  if(act==='usr-del'){
    var u2 = byId(USERS, el.getAttribute('data-id'));
    if(!u2) return;
    if(!confirmDelete('usr', u2.name, u2.id)) return;
    removeById(USERS, u2.id);
    for(var key in COURSES){
      if(!COURSES.hasOwnProperty(key)) continue;
      COURSES[key].users = COURSES[key].users.filter(function(x){ return x !== u2.id; });
    }
    render(); toast(u2.name + ' を削除しました');
    return;
  }
  if(act==='save-usr'){
    var un = val('m-name').replace(/^\s+|\s+$/g,'');
    if(!un){ window.alert('お名前を入力してください。'); return; }
    var age = parseInt(val('m-age'),10); if(isNaN(age)) age = '';
    var uds = form.days.slice().sort(function(a,b){ return a-b; });
    if(form.id){
      var tu = byId(USERS, form.id);
      tu.name = un; tu.kana = val('m-kana'); tu.age = age; tu.area = val('m-area');
      tu.tel = val('m-tel'); tu.move = val('m-move'); tu.days = uds; tu.note = val('m-note');
    }else{
      USERS.push({id:newId('u', USERS), name:un, kana:val('m-kana'), age:age, area:val('m-area'),
                  tel:val('m-tel'), move:val('m-move'), days:uds, note:val('m-note')});
    }
    closeModal(); render(); toast(un + ' 様を保存しました');
    return;
  }

  /* 職員 */
  if(act==='stf-new'){
    form = {id:'', name:'', role:'介護職員', tel:''};
    modal = 'stf'; renderModal(); return;
  }
  if(act==='stf-edit'){
    var s = byId(STAFF, el.getAttribute('data-id'));
    if(!s) return;
    form = {id:s.id, name:s.name, role:s.role, tel:s.tel};
    modal = 'stf'; renderModal(); return;
  }
  if(act==='stf-del'){
    var s2 = byId(STAFF, el.getAttribute('data-id'));
    if(!s2) return;
    if(!confirmDelete('stf', s2.name, s2.id)) return;
    removeById(STAFF, s2.id);
    render(); toast(s2.name + ' を削除しました');
    return;
  }
  if(act==='save-stf'){
    var sn = val('m-name').replace(/^\s+|\s+$/g,'');
    if(!sn){ window.alert('お名前を入力してください。'); return; }
    if(form.id){
      var ts = byId(STAFF, form.id);
      ts.name = sn; ts.role = val('m-role'); ts.tel = val('m-tel');
    }else{
      STAFF.push({id:newId('s', STAFF), name:sn, role:val('m-role'), tel:val('m-tel')});
    }
    closeModal(); render(); toast(sn + ' を保存しました');
    return;
  }
});

function readCond(){
  var f = document.getElementById('f-date');
  if(!f) return;
  searchCond.date      = val('f-date');
  searchCond.slot      = val('f-slot');
  searchCond.staffId   = val('f-staff');
  searchCond.vehicleId = val('f-veh');
  searchCond.name      = val('f-name').replace(/^\s+|\s+$/g,'');
}

document.addEventListener('change', function(e){
  var el = closest(e.target, '[data-rec]');
  if(el && rec){
    rec[el.getAttribute('data-rec')] = el.value;
    var sb = document.getElementById('recSubmit');
    if(sb) sb.disabled = !(rec.vehicleId && rec.staffId && rec.depart && rec.picked.length > 0);
  }
  var ae = closest(e.target, '[data-abs]');
  if(ae && abs) abs[ae.getAttribute('data-abs')] = ae.value;
});

document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && modal) closeModal();
});

render();
</script>
